name: Verified release
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
concurrency:
  group: verified-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test source and report controls
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m inventory_lab --skus 20 --days 30 --seeds 7 --output output/ci
          node tests/report_smoke.js output/ci/report.html
          node tests/evidence_smoke.js
          python3 -m compileall -q inventory_lab
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish immutable version reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
