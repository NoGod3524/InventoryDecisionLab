name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit and accounting tests
        run: python3 -m unittest discover -s tests -v
      - name: Smoke experiment
        run: python3 -m inventory_lab --skus 20 --days 30 --seeds 7 --output output/ci
      - name: Report control and undefined-service checks
        run: |
          node tests/report_smoke.js
          node tests/evidence_smoke.js
      - name: Public-schema adapter fixture
        run: python3 -m inventory_lab.replay --input tests/fixtures/retail.csv --start-date 2020-01-01 --skus 2 --warmup 28 --days 4 --fixture --output output/fixture
